<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer Organizer</title>
<meta name="theme-color" content="#1c2331">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
/* Apply saved theme before first paint to avoid a flash. */
try {
  var p = JSON.parse(localStorage.getItem("timerOrganizer.prefs") || "{}");
  var t = p.theme || "system";
  if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  document.documentElement.dataset.transparent = String(!!p.transparent);
} catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="popNote" class="popNote" hidden>
  <p>The timer is open in the pop-out window.</p>
  <button id="popBack" class="primary">Bring back</button>
</div>

<div id="app">
<main>
  <header class="clock">
    <div class="stat">
      <span class="label">Total time</span>
      <span id="total" class="num">0:00</span>
    </div>
    <div class="stat">
      <span class="label">Expected end</span>
      <span id="endTime" class="num">--:--</span>
      <span id="endIn" class="sub"></span>
    </div>
  </header>

  <section class="current" aria-live="off">
    <div class="curName" id="curName">Off-Track</div>
    <div class="curTimes">
      <span id="curDiff" class="diff"></span>
      <span id="curTime" class="big">0:00.0</span>
    </div>
  </section>

  <section class="controls">
    <button id="runBtn" class="primary">Start</button>
    <button id="finishBtn">Finish split</button>
    <button id="addBtn">Add task</button>
  </section>
  <section class="controls secondary">
    <button id="bulkBtn">Select</button>
    <button id="resetTimesBtn">Reset times</button>
    <button id="resetRunBtn" class="danger">Reset run</button>
    <button id="popBtn" hidden>Pop out</button>
    <button id="settingsBtn" aria-label="Settings">Settings</button>
  </section>

  <section id="bulkBar" class="controls bulk" hidden>
    <span id="bulkCount" class="muted">0 selected</span>
    <button id="bulkAll">Select all</button>
    <button id="bulkDone">Mark done</button>
    <button id="bulkOpen">Reopen</button>
    <button id="bulkReset">Reset time</button>
    <button id="bulkEst">Set estimate</button>
    <button id="bulkDel" class="danger">Delete</button>
  </section>

  <ul id="splits" class="splits"></ul>
  <p id="empty" class="empty" hidden>No tasks yet. Add one with an estimated time to create your first split.</p>
</main>

<dialog id="taskDlg">
  <form id="taskForm">
    <h2 id="taskDlgTitle">Add task</h2>
    <label>Name <input id="taskName" required maxlength="80" autocomplete="off"></label>
    <label>Estimated time (minutes) <input id="taskEst" type="number" min="0" step="any" value="25" required inputmode="decimal"></label>
    <div class="row">
      <button type="button" id="taskCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="estDlg">
  <form id="estForm">
    <h2>Set estimate</h2>
    <label>Estimated time (minutes) for selected tasks <input id="estVal" type="number" min="0" step="any" value="25" required inputmode="decimal"></label>
    <div class="row">
      <button type="button" id="estCancel">Cancel</button>
      <button type="submit" class="primary">Apply</button>
    </div>
  </form>
</dialog>

<dialog id="askDlg">
  <div class="dlgBody">
    <p id="askMsg" class="askMsg"></p>
    <div class="row">
      <button id="askCancel">Cancel</button>
      <button id="askOk" class="primary">OK</button>
    </div>
  </div>
</dialog>

<dialog id="settingsDlg">
  <div class="dlgBody">
    <h2>Settings</h2>

    <h3>Appearance</h3>
    <label>Theme
      <select id="themeSel">
        <option value="system">System</option>
        <option value="dark">Dark (night)</option>
        <option value="light">Light</option>
      </select>
    </label>
    <label class="check"><input id="transChk" type="checkbox"> Transparent background</label>
    <label class="check"><input id="topChk" type="checkbox"> Always on top (pop-out window)</label>
    <p id="topNote" class="muted"></p>

    <h3>Data</h3>
    <div class="row wrap">
      <button id="exportBtn">Export to file</button>
      <button id="importBtn">Import from file</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>

    <h3>Sync (Firestore)</h3>
    <p id="syncStatus" class="muted">Not configured.</p>
    <label>Firebase config
      <textarea id="cfgText" rows="6" spellcheck="false" placeholder='Paste the firebaseConfig object from the Firebase console'></textarea>
    </label>
    <div class="row wrap">
      <button id="cfgSave">Save config</button>
      <button id="cfgClear">Remove config</button>
    </div>
    <div id="authBox" hidden>
      <label>Email <input id="email" type="email" autocomplete="username"></label>
      <label>Password <input id="password" type="password" autocomplete="current-password"></label>
      <div class="row wrap">
        <button id="signInBtn" class="primary">Sign in</button>
        <button id="signUpBtn">Create account</button>
      </div>
    </div>
    <div id="signedBox" hidden class="row wrap">
      <button id="signOutBtn">Sign out</button>
    </div>

    <div class="row"><button id="settingsClose" class="primary">Close</button></div>
  </div>
</dialog>
</div>

<script src="app.js"></script>
</body>
</html>
